# Deploy the site to GitHub Pages on every push to main, stamping the commit
# into app.js so every log records exactly which code produced it.
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp version
        run: |
          sed -i "s/__COMMIT__/${GITHUB_SHA::7}/; s/__BUILT__/$(date -u +%Y-%m-%dT%H:%M:%SZ)/" app.js
          grep -n "const COMMIT\|const BUILT" app.js
      # Browsers cache files for ~10 min; without this a visit just after a
      # deploy can mix old and new modules and break the app. Tag every
      # .js/.css reference with the commit so each deploy is a fresh set.
      - name: Cache-bust file references
        run: |
          sed -i -E "s/\.(js|css)(['\"])/.\1?v=${GITHUB_SHA::7}\2/g" *.js index.html tests/*.html
          grep -n "?v=" *.js index.html tests/*.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
