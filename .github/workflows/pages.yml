# Deploy the site to GitHub Pages on every push to main, stamping the commit
# into app.js so every log records exactly which code produced it.
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp version
        run: |
          sed -i "s/__COMMIT__/${GITHUB_SHA::7}/; s/__BUILT__/$(date -u +%Y-%m-%dT%H:%M:%SZ)/" app.js
          grep -n "const COMMIT\|const BUILT" app.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
